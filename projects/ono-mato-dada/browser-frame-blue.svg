<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" fill="none" aria-hidden="true">
  <title>Browser window — blue flat style</title>
  <!-- Main window -->
  <rect x="0" y="0" width="932" height="586" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <!-- Toolbar -->
  <path d="M0 0h932v52H0V0z" fill="#F8FAFF"/>
  <line x1="0" y1="52" x2="932" y2="52" stroke="#2563EB" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Window controls -->
  <g stroke="#2563EB" stroke-width="1.5" stroke-linecap="round">
    <path d="M22 26l7 7M29 26l-7 7"/>
    <path d="M46 30h9"/>
