<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sauna-lore | linlinlin.online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=BDO+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            background-color: #f2f2f2;
        }

        main.project-page {
            padding: 0;
            max-width: 100%;
        }

        .browser-frame {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 20px;
            border-radius: 18px;
        }

        .browser-frame__inner {
            position: relative;
            width: 100%;
            line-height: 0;
            border-radius: 18px;
            overflow: hidden;
            isolation: isolate;
            filter: drop-shadow(8px 8px 0px #c0c0c0);
        }

        .browser-frame__chrome {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
            user-select: none;
        }

        .browser-frame__slot {
            position: absolute;
            z-index: 2;
            left: 0;
            top: calc(100% * 52 / 620);
            width: calc(100% * 932 / 960);
            height: calc(100% * 534 / 620);
            overflow: hidden;
            background: #000000;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 0 16px 16px;
            pointer-events: auto;
        }

        .browser-frame__slot iframe {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            display: block;
        }

        .embed-fallback-note {
            font-family: 'BDO Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 13px;
            color: #666666;
            margin-top: 0.75rem;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 768px) {
            .browser-frame {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="../projects.html" class="active">projects</a>
            <a href="../info.html">info</a>
            <a href="../writings.html">writings</a>
        </nav>
    </header>

    <main class="project-page">
        <div class="project-content">
            <div class="browser-frame" id="saunaLoreBrowserFrame" aria-label="Sauna Lore in browser frame">
                <div class="browser-frame__inner">
                    <img
                        id="browserFrameChromeImg"
                        class="browser-frame__chrome"
                        src="ono-mato-dada/browser-frame-wireframe.svg"
                        alt=""
                        width="960"
                        height="620"
                        decoding="async"
                        draggable="false">
                    <div class="browser-frame__slot">
                        <iframe
                            id="saunaLoreIframe"
                            src="https://saunalore.com/"
                            title="Sauna Lore"
                            loading="eager"
                            allowfullscreen
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>

        <div class="project-info-container">
            <div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 3rem; align-items: start;">
                <div>
                    <h2 class="project-info-title">sauna-lore</h2>
                    <p class="project-info-description">
                        Tales from the Vital sauna. A documentation project exploring sauna culture and community.
                    </p>
                </div>
                <div>
                    <p style="font-family: 'BDO Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.7; color: #666666; margin-top: 0;">
                        A vanilla javascript project built with p5.js and p5.sound.
                    </p>
                    <a href="https://saunalore.com/" target="_blank" rel="noopener noreferrer" style="font-family: 'BDO Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: #333333; text-decoration: underline; text-underline-offset: 3px;">open saunalore.com →</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>adeline setiawan © 2026 | <a href="https://github.com/halfabluebanana" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script>
    /* Same slot geometry as ono-mato-dada: viewBox 960×620 */
    (function () {
        var VB_W = 960;
        var VB_H = 620;
        var TOOLBAR = 52;
        var WIN_W = 932;
        var CONTENT_H = 534;
        var CHROME_WF = 'ono-mato-dada/browser-frame-wireframe.svg';

        function syncBrowserFrameSlot() {
            var inner = document.querySelector('.browser-frame__inner');
            var slot = document.querySelector('.browser-frame__slot');
            if (!inner || !slot) return;
            var w = inner.offsetWidth;
            var h = inner.offsetHeight;
            if (w < 2 || h < 2) return;
            slot.style.top = (TOOLBAR / VB_H * h) + 'px';
            slot.style.left = '0';
            slot.style.width = (WIN_W / VB_W * w) + 'px';
            slot.style.height = (CONTENT_H / VB_H * h) + 'px';
        }

        function init() {
            var img = document.getElementById('browserFrameChromeImg');
            if (img) img.src = CHROME_WF;
            syncBrowserFrameSlot();
            requestAnimationFrame(function () {
                requestAnimationFrame(syncBrowserFrameSlot);
            });
            window.addEventListener('resize', syncBrowserFrameSlot);
            var inner = document.querySelector('.browser-frame__inner');
            if (inner && typeof ResizeObserver !== 'undefined') {
                new ResizeObserver(syncBrowserFrameSlot).observe(inner);
            }
            window.addEventListener('load', syncBrowserFrameSlot);
            if (img) img.addEventListener('load', syncBrowserFrameSlot);

            var tries = 0;
            var iv = window.setInterval(function () {
                syncBrowserFrameSlot();
                tries++;
                var innerEl = document.querySelector('.browser-frame__inner');
                if (innerEl && innerEl.offsetHeight > 2 && tries > 2) {
                    window.clearInterval(iv);
                }
                if (tries > 80) window.clearInterval(iv);
            }, 50);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
    <script src="../script.js"></script>
</body>
</html>
