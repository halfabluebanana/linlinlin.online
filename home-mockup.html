<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home | linlinlin.online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=BDO+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            background: radial-gradient(ellipse 140% 120% at 50% -10%, #1a0a2e 0%, #0d0221 35%, #05010a 100%);
            min-height: 100vh;
        }

        /* ── Fixed frames ─────────────────────────────── */
        .tm-frame {
            position: fixed;
            top: 62vh;
            left: 50%;
            width: 62vw;
            max-width: 860px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            will-change: transform, opacity, filter;
            /* transform, opacity, filter, z-index set by JS */
        }

        /* ── Frame background (video or colored placeholder) ── */
        .tm-bg {
            position: absolute;
            inset: 0;
        }

        .tm-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tm-placeholder-text {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 1rem;
        }

        .tm-placeholder-cat {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .tm-placeholder-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(14px, 2vw, 22px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
        }

        .tm-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ── Info bar (always visible) ─────────────────── */
        .frame-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 3rem 1.4rem 1.1rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.78) 0%, transparent 100%);
            pointer-events: none;
        }

        .f-cat {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .f-title {
            display: block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: clamp(12px, 1.6vw, 20px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.2;
        }

        .f-desc {
            font-family: 'BDO Grotesk', sans-serif;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin: 0.3rem 0 0;
            line-height: 1.5;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease;
        }

        .tm-frame.is-current .f-desc {
            max-height: 4em;
            opacity: 1;
        }

        /* ── Timeline ──────────────────────────────────── */
        .timeline {
            position: fixed;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 400;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.9rem;
        }

        .tl-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            opacity: 0.28;
            transition: opacity 0.3s ease;
        }

        .tl-item:hover   { opacity: 0.65; }
        .tl-item.active  { opacity: 1; }

        .tl-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            display: none;
        }

        .tl-item.active .tl-label { display: block; }

        .tl-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            background: transparent;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .tl-item.active .tl-dot {
            background: #fff;
            border-color: #fff;
            width: 8px;
            height: 8px;
        }

        /* ── Fixed header / footer ─────────────────────── */
        header {
            position: fixed !important;
            top: 0; left: 0; right: 0;
            z-index: 500;
            background: transparent;
            padding: 1.8rem 2rem 0 0;
        }

        body header nav a,
        body header nav a:link,
        body header nav a:visited { color: rgba(255, 255, 255, 0.65); }
        body header nav a:hover   { color: #fff; opacity: 1; }
        body header nav a.active  { color: rgba(255, 255, 255, 0.88); }
        body header nav a::after  { background-color: rgba(255, 255, 255, 0.7); }

        footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 500;
            max-width: none; width: 100%;
            margin: 0;
            padding: 0.8rem 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            box-sizing: border-box;
        }

        footer p,
        footer a,
        footer a:visited { color: rgba(255, 255, 255, 0.35); font-size: 13px; }
        footer a:hover   { color: rgba(255, 255, 255, 0.65) !important; }

        /* ── Invisible scroll driver ───────────────────── */
        #scroll-driver { position: relative; z-index: -1; }

        @media (max-width: 768px) {
            .tm-frame  { width: 88vw; top: 65vh; }
            .timeline  { right: 1rem; }
            .f-title   { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="projects.html">projects</a>
            <a href="info.html">info</a>
            <a href="writings.html">writings</a>
        </nav>
    </header>

    <nav class="timeline" id="timeline" aria-label="Projects"></nav>
    <div id="scroll-driver"></div>

    <footer>
        <p>adeline setiawan © 2026 | <a href="https://github.com/halfabluebanana" target="_blank" rel="noopener noreferrer">GitHub</a></p>
    </footer>

    <script>
        /* ── Projects (mirrors projects.html) ────────────── */
        const projects = [
            {
                title: 'ono-mato-dada',
                category: 'software',
                desc: 'Interactive exploration of sound and visual patterns through phoneme manipulation',
                video: 'projects/ono-mato-dada/thumbnail_ono-mato-dada-v3_pink.m4v',
                videoType: 'video/mp4',
                bg: '#1a0d2e',
                link: 'projects/ono-mato-dada.html'
            },
            {
                title: 'sauna lore',
                category: 'software',
                desc: 'Tales from the Vital sauna. A documentation project exploring sauna culture and community',
                video: 'projects/sauna-lore/thumbnail_sauna-lore.mov',
                videoType: 'video/quicktime',
                bg: '#0d1a1a',
                link: 'projects/sauna-lore.html'
            },
            {
                title: 'word soup',
                category: 'software',
                desc: null,
                video: null,
                bg: '#1c1535',
                link: '#'
            },
            {
                title: 'cursor shadows',
                category: 'software',
                desc: null,
                video: null,
                bg: '#18182a',
                link: '#'
            },
            {
                title: 'relative compass',
                category: 'software',
                desc: null,
                video: null,
                bg: '#0f1c2e',
                link: '#'
            },
            {
                title: 'creative code sketches',
                category: 'software',
                desc: null,
                video: null,
                bg: '#0e1e18',
                link: '#'
            },
            {
                title: 'blink twice for danger',
                category: 'sculpture',
                desc: null,
                video: null,
                bg: '#28120f',
                link: '#'
            },
            {
                title: 'susurrus',
                category: 'sculpture',
                desc: null,
                video: null,
                bg: '#101828',
                link: '#'
            },
            {
                title: 'hansel and gretel',
                category: 'sculpture',
                desc: null,
                video: null,
                bg: '#221810',
                link: '#'
            },
            {
                title: 'woodworking',
                category: 'sculpture',
                desc: null,
                video: null,
                bg: '#121c0e',
                link: '#'
            },
            {
                title: 'films',
                category: 'film',
                desc: null,
                video: null,
                bg: '#141424',
                link: '#'
            },
            {
                title: 'design',
                category: 'design',
                desc: null,
                video: null,
                bg: '#1c1c28',
                link: '#'
            },
            {
                title: 'entrepreneurship',
                category: 'entrepreneurship',
                desc: null,
                video: null,
                bg: '#141e14',
                link: '#'
            }
        ];

        /* ── Layout constants ───────────────────────────── */
        const FRONT_TOP_VH   = 62;   // vh from top for all frame base position
        const Y_STEP_VH      = 11;   // how far each step-back frame shifts upward (vh)
        const SCALE_STEP     = 0.82; // scale multiplier per step back
        const N_VISIBLE      = 5;    // frames visible behind current
        const LERP            = 0.072;
        const SCROLL_PER_FRAME = window.innerHeight * 1.35;

        /* ── Scroll driver ──────────────────────────────── */
        const driver = document.getElementById('scroll-driver');
        const totalH = (projects.length - 1) * SCROLL_PER_FRAME + window.innerHeight;
        driver.style.height = `${totalH}px`;

        /* ── Build frames ───────────────────────────────── */
        const frames = projects.map((proj, i) => {
            const frame = document.createElement('div');
            frame.className = 'tm-frame';
            frame.style.zIndex = projects.length - i;

            // Placeholder (always present; video overlays it when loaded)
            const placeholder = `
                <div class="tm-placeholder" style="background:${proj.bg}">
                    <div class="tm-placeholder-text">
                        <span class="tm-placeholder-cat">${proj.category}</span>
                        <span class="tm-placeholder-title">${proj.title}</span>
                    </div>
                </div>`;

            // Video (optional)
            let video = '';
            if (proj.video) {
                video = `<video class="tm-video" autoplay loop muted playsinline>
                    <source src="${proj.video}" type="${proj.videoType}">
                </video>`;
            }

            frame.innerHTML = `
                <div class="tm-bg">
                    ${placeholder}
                    ${video}
                </div>
                <div class="frame-info">
                    <span class="f-cat">${proj.category}</span>
                    <span class="f-title">${proj.title}</span>
                    ${proj.desc ? `<p class="f-desc">${proj.desc}</p>` : ''}
                </div>`;

            // Video handling
            const vid = frame.querySelector('video');
            if (vid) {
                vid.muted = true;
                const tryPlay = () => vid.play().catch(() => {});
                vid.addEventListener('canplay', tryPlay, { once: true });
                // Hide if unsupported (e.g. .mov on Chrome)
                vid.addEventListener('error', () => { vid.style.display = 'none'; });
                document.addEventListener('click', () => vid.play().catch(() => {}), { once: true });
            }

            frame.addEventListener('click', () => {
                if (proj.link && proj.link !== '#') window.location.href = proj.link;
            });

            document.body.appendChild(frame);
            return frame;
        });

        /* ── Build timeline ─────────────────────────────── */
        const timelineEl = document.getElementById('timeline');
        const tlItems = projects.map((proj, i) => {
            const item = document.createElement('div');
            item.className = 'tl-item';
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0');
            item.setAttribute('aria-label', proj.title);
            item.innerHTML = `<span class="tl-label">${proj.title}</span><div class="tl-dot"></div>`;
            item.addEventListener('click', () => scrollToFrame(i));
            item.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') scrollToFrame(i);
            });
            timelineEl.appendChild(item);
            return item;
        });

        function scrollToFrame(idx) {
            const maxScroll = totalH - window.innerHeight;
            window.scrollTo({
                top: maxScroll > 0 ? (idx / (projects.length - 1)) * maxScroll : 0,
                behavior: 'smooth'
            });
        }

        /* ── Scroll tracking ───────────────────────────── */
        let progress = 0;
        let target   = 0;

        window.addEventListener('scroll', () => {
            const max = totalH - window.innerHeight;
            target = max > 0
                ? Math.min(projects.length - 1, Math.max(0,
                    (window.scrollY / max) * (projects.length - 1)))
                : 0;
        }, { passive: true });

        document.addEventListener('keydown', e => {
            const cur = Math.round(progress);
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                scrollToFrame(Math.min(projects.length - 1, cur + 1));
            }
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                scrollToFrame(Math.max(0, cur - 1));
            }
        });

        /* ── Animation loop ────────────────────────────── */
        function tick() {
            progress += (target - progress) * LERP;
            const activeIdx = Math.round(progress);

            frames.forEach((frame, i) => {
                const offset = i - progress;    // 0 = front, + = behind, - = passed
                const scale  = Math.pow(SCALE_STEP, offset);
                const yShift = -offset * Y_STEP_VH; // vh (negative = upward)

                // Opacity: passed frames fade out; distant future frames fade at threshold
                let opacity;
                if (offset < 0) {
                    opacity = Math.max(0, 1 + offset); // fully fades at offset = -1
                } else if (offset > N_VISIBLE) {
                    opacity = 0;
                } else if (offset > N_VISIBLE - 1) {
                    opacity = Math.max(0, N_VISIBLE - offset);
                } else {
                    opacity = 1;
                }

                // Brightness: front = 1.0, receding frames progressively dimmer
                const brightness = Math.max(0.3, 1 - Math.max(0, offset) * 0.14);

                frame.style.transform = `translate(-50%, calc(-50% + ${yShift}vh)) scale(${scale})`;
                frame.style.opacity   = opacity;
                frame.style.filter    = `brightness(${brightness})`;
                frame.classList.toggle('is-current', i === activeIdx);
            });

            tlItems.forEach((item, i) => item.classList.toggle('active', i === activeIdx));

            requestAnimationFrame(tick);
        }

        tick();
    </script>
</body>
</html>
